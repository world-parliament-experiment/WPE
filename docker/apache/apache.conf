<VirtualHost *:80>
    DocumentRoot /var/www/wpe/public
    ServerName wpe.local
 
    <Directory /var/www/wpe/public>
        AllowOverride None
        Require all granted

        <IfModule mod_rewrite.c>
            RewriteEngine On
            RewriteCond %{REQUEST_FILENAME} !-f
            RewriteRule ^(.*)$ index.php [QSA,L]
        </IfModule>
    </Directory>
</VirtualHost>
